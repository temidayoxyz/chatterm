name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What terminal workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: platforms
    attributes:
      label: Platform and shell considerations
  - type: checkboxes
    id: privacy
    attributes:
      label: Local-first check
      options:
        - label: This proposal explains any network or data-retention impact.
          required: true
